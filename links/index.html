<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Links – Abdul Kader Sabouni</title>
    <meta name="description" content="Alle Links von Abdul Kader Sabouni: interaktiver Lebenslauf, GitHub, KI-Videos und Kontakt.">
    <meta property="og:image" content="../assets/img/profilbild.jpg">
    <meta name="color-scheme" content="light dark">
    <!-- Farbmodus und Sprache wie auf der Hauptseite (gespeicherte Wahl, ?theme= / ?lang=, sonst System/Browser) -->
    <script>
        (function () {
            var q = new URLSearchParams(location.search), get = function (k) { try { return JSON.parse(localStorage.getItem('cvworld:' + k)); } catch (e) { return null; } };
            var t = q.get('theme'); t = /^(light|dark)$/.test(t) ? t : (/^(light|dark)$/.test(get('theme')) ? get('theme') : null);
            var dark = t ? t === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
            var l = q.get('lang'); l = /^(de|en)$/.test(l) ? l : (get('lang') || ((navigator.language || 'de').slice(0, 2) === 'en' ? 'en' : 'de'));
            document.documentElement.dataset.theme = dark ? 'dark' : 'light';
            document.documentElement.lang = l === 'en' ? 'en' : 'de';
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f4f6fb; --paper: #fff; --ink: #141b2d; --muted: #5f6880; --line: #e6e9f0; --accent: #c2410c; color-scheme: light; }
        :root[data-theme="dark"] { --bg: #0b1020; --paper: #151c33; --ink: #e7ebf7; --muted: #a7b0c8; --line: #2c3554; --accent: #ff9b66; color-scheme: dark; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font: 16px/1.5 'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; }
        main { max-width: 520px; margin: 0 auto; padding: calc(36px + env(safe-area-inset-top, 0px)) 18px 48px; text-align: center; }
        .photo { width: 112px; height: 112px; border-radius: 30px; object-fit: cover; margin: 0 auto 14px; display: block; box-shadow: 0 12px 30px rgba(12, 20, 40, 0.2); }
        h1 { font-family: 'Bricolage Grotesque', 'Outfit', sans-serif; font-size: 1.8rem; letter-spacing: -0.02em; }
        .role { color: var(--muted); margin: 4px 0 26px; }
        ul { list-style: none; display: grid; gap: 12px; }
        .link { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 18px; background: var(--paper); border: 1px solid var(--line); color: var(--ink); text-decoration: none; text-align: left; transition: transform 0.15s; }
        a.link:hover { transform: translateY(-2px); }
        .link .ic { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border-radius: 13px; background: var(--bg); color: var(--accent); }
        .link .ic svg { width: 22px; height: 22px; }
        .link strong { display: block; font-size: 1.02rem; }
        .link small { color: var(--muted); font-size: 0.86rem; }
        .link .go { margin-left: auto; color: var(--muted); font-weight: 700; font-size: 0.85rem; white-space: nowrap; }
        .link.soon { opacity: 0.7; }
        footer { margin-top: 30px; font-size: 0.85rem; color: var(--muted); display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
        footer a { color: var(--accent); font-weight: 600; }
    </style>
</head>

<body>
    <main>
        <img class="photo" id="photo" alt="">
        <h1 id="name"></h1>
        <p class="role" id="role"></p>
        <ul id="links"></ul>
        <footer>
            <a href="?lang=de" hreflang="de">Deutsch</a>
            <a href="?lang=en" hreflang="en">English</a>
            <a href="../datenschutz.html" id="privacy">Datenschutz</a>
        </footer>
        <noscript><p><a href="../">Interaktiver Lebenslauf</a> · <a href="https://github.com/Abdul7Kader">GitHub</a></p></noscript>
    </main>

    <!-- Inhalte wie auf der Hauptseite; Pflege im Admin unter „Linkseite /links/“ -->
    <script src="../data/resume.de.js"></script>
    <script src="../data/resume.en.js"></script>
    <script type="module">
        import { icon } from '../js/core/icons.js';
        const l = document.documentElement.lang === 'en' ? 'en' : 'de';
        const R = window.RESUME || {}, de = R.de || {}, own = R[l] || {};
        const pick = (k) => (own[k] !== undefined && own[k] !== '' ? own[k] : de[k]);
        const TXT = { de: { soon: 'folgt', open: 'Öffnen', privacy: 'Datenschutz', photo: 'Foto von ' }, en: { soon: 'coming soon', open: 'Open', privacy: 'Privacy', photo: 'Photo of ' } }[l];
        const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const img = (pick('profileImage') || '').replace(/^(?!https?:|\/|\.\.)/, '../');
        const photo = document.getElementById('photo');
        photo.src = img; photo.alt = TXT.photo + (de.name || '');
        document.getElementById('name').textContent = de.name || '';
        document.getElementById('role').textContent = pick('title') || '';
        document.getElementById('privacy').textContent = TXT.privacy;
        document.title = 'Links – ' + (de.name || '');
        const links = pick('links') || [];
        document.getElementById('links').innerHTML = links.map(k => {
            const inner = `<span class="ic">${icon(k.icon || 'external')}</span><span><strong>${esc(k.title)}</strong>${k.note ? `<small>${esc(k.note)}</small>` : ''}</span>`;
            if (!k.url) return `<li><div class="link soon">${inner}<span class="go">${TXT.soon}</span></div></li>`;
            const ext = /^https?:/.test(k.url);
            return `<li><a class="link" href="${esc(k.url)}"${ext ? ' target="_blank" rel="noopener"' : ''}>${inner}<span class="go">${TXT.open} ${ext ? '↗' : '→'}</span></a></li>`;
        }).join('');
    </script>
</body>

</html>

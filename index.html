<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Abdul Kader Sabouni – Interaktiver Lebenslauf</title>
    <meta name="description" content="Abdul Kader Sabouni – Softwareentwickler und Informatikstudent (FH Dortmund). Mein Lebenslauf als kleine, begehbare Spielwelt – oder kompakt in 30 Sekunden.">
    <meta property="og:title" content="Abdul Kader Sabouni – Interaktiver Lebenslauf">
    <meta property="og:description" content="Vom Neuanfang 2014 zum Softwareentwickler bei PSI Software SE – als begehbare Spielwelt.">
    <meta property="og:image" content="profilbild.jpg">
    <meta name="theme-color" content="#1b2a4a">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Die Spielwelt -->
    <canvas id="world" aria-label="Begehbare Lebenslauf-Welt"></canvas>
    <div id="vignette" aria-hidden="true"></div>
    <div id="bubbles" aria-hidden="true"></div>

    <!-- HUD -->
    <header id="hud" class="hidden">
        <button id="hud-profile" class="glass" title="Meine Stationen anzeigen">
            <img id="hud-photo" alt="">
            <span class="hud-id">
                <strong id="hud-name"></strong>
                <span id="hud-progress-label">0 / 7 Stationen</span>
                <span class="progress"><span id="hud-progress-bar"></span></span>
            </span>
        </button>
        <div id="hud-badges" class="glass" title="Gesammelte Stärken"></div>
        <div class="hud-actions">
            <button id="btn-cv" class="glass pill strong" title="Lebenslauf kompakt">⚡ <span class="lbl">Lebenslauf kompakt</span></button>
            <button id="btn-map" class="glass icon" title="Stationen &amp; Schnellreise">🗺️</button>
            <button id="btn-sound" class="glass icon" title="Soundeffekte an/aus">🔊</button>
            <button id="btn-music" class="glass icon off" title="Musik an/aus">♪</button>
        </div>
    </header>

    <button id="objective" class="glass hidden" title="Automatisch hinlaufen">
        <span class="obj-kicker">Nächstes Ziel</span>
        <span id="objective-text"></span>
        <span class="obj-go">Hinlaufen →</span>
    </button>

    <div id="tokens" class="glass hidden" title="Gesammelte Skill-Sterne">⭐ <span id="tokens-val">0</span>/<span id="tokens-max">0</span></div>

    <div id="controls-hint" class="hidden"></div>

    <button id="action-btn" class="hidden">Betreten</button>
    <div id="joystick" class="hidden"><div id="joystick-knob"></div></div>

    <div id="toasts" aria-live="polite"></div>

    <!-- Startbildschirm -->
    <section id="start" class="overlay">
        <div class="start-card">
            <div class="start-photo-wrap">
                <img id="start-photo" alt="Foto von Abdul Kader Sabouni">
                <span class="wave">👋</span>
            </div>
            <p id="start-greeting" class="kicker"></p>
            <h1 id="start-title"></h1>
            <p id="start-role" class="role"></p>
            <p id="start-tagline" class="tagline"></p>
            <div id="start-stats" class="stats"></div>
            <div class="start-buttons">
                <button id="start-play" class="btn primary big">
                    <span>▶ Welt erkunden</span><small>ca. 3 Minuten · spielerisch</small>
                </button>
                <button id="start-cv" class="btn ghost big">
                    <span>⚡ Lebenslauf kompakt</span><small>30 Sekunden · klassisch</small>
                </button>
            </div>
            <p class="start-foot" id="start-foot"></p>
        </div>
    </section>

    <!-- Stations-Dialog (Story, Minispiel, Infos) -->
    <section id="station" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="station-title">
        <div class="panel">
            <button class="close" id="station-close" aria-label="Schließen">✕</button>
            <header class="panel-head">
                <span id="station-emoji" class="panel-emoji"></span>
                <div>
                    <span id="station-era" class="kicker"></span>
                    <h2 id="station-title"></h2>
                </div>
            </header>
            <div id="station-body"></div>
        </div>
    </section>

    <!-- Reise-/Stationsliste -->
    <section id="journey" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Stationen">
        <div class="panel narrow">
            <button class="close" data-close="journey" aria-label="Schließen">✕</button>
            <header class="panel-head">
                <span class="panel-emoji">🗺️</span>
                <div>
                    <span class="kicker">Mein Weg in 8 Stationen</span>
                    <h2>Schnellreise</h2>
                </div>
            </header>
            <p class="muted">Klicken Sie auf eine Station – ich laufe automatisch hin.</p>
            <ol id="journey-list"></ol>
        </div>
    </section>

    <!-- Kompakter Lebenslauf (auch Druck/PDF) -->
    <section id="cv" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Lebenslauf kompakt">
        <div class="cv-sheet" id="cv-sheet"></div>
    </section>

    <noscript>
        <div style="padding:24px;font-family:sans-serif">
            <h1>Abdul Kader Sabouni</h1>
            <p>Softwareentwickler (Werkstudent) bei PSI Software SE · Informatikstudium an der FH Dortmund.</p>
            <p>Für die interaktive Version bitte JavaScript aktivieren.</p>
        </div>
    </noscript>

    <a href="admin.html" id="admin-link" title="Admin">⚙︎</a>

    <script src="data.js"></script>
    <script src="js/util.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/world.js"></script>
    <script src="js/minigames.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>

</html>

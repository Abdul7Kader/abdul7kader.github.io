<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Abdul Kader Sabouni – Interaktiver Lebenslauf</title>
    <meta name="description" content="Abdul Kader Sabouni – Softwareentwickler und Informatikstudent (FH Dortmund). Mein Lebenslauf als begehbare Spielwelt mit sechs Minispielen – oder kompakt in 30 Sekunden.">
    <meta property="og:title" content="Abdul Kader Sabouni – Interaktiver Lebenslauf">
    <meta property="og:description" content="Vom Neuanfang 2014 zum Softwareentwickler bei PSI Software SE – als begehbare Spielwelt mit sechs Minispielen.">
    <meta property="og:image" content="assets/img/profilbild.jpg">
    <meta name="theme-color" content="#0d1530">
    <meta name="color-scheme" content="light dark">
    <!-- Farbmodus vor dem ersten Zeichnen setzen (kein helles Aufblitzen im Dunkelmodus); Logik: js/core/theme.js -->
    <script>
        (function () {
            var p = new URLSearchParams(location.search).get('theme'), s = null;
            try { s = JSON.parse(localStorage.getItem('cvworld:theme')); } catch (e) { /* privater Modus */ }
            // eigene Wahl (Hell/Dunkel) oder – ohne Wahl – die Systemeinstellung
            var pref = /^(light|dark)$/.test(p) ? p : /^(light|dark)$/.test(s) ? s : null;
            var dark = pref ? pref === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        })();
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Outfit:wght@400;500;600;700;800&family=Permanent+Marker&display=swap" rel="stylesheet">
    <!-- Stile nach Bereichen; Reihenfolge = Vorrang (später gewinnt) -->
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/hud.css">
    <link rel="stylesheet" href="css/controls.css">
    <link rel="stylesheet" href="css/start.css">
    <link rel="stylesheet" href="css/station.css">
    <link rel="stylesheet" href="css/games.css">
    <link rel="stylesheet" href="css/facts.css">
    <link rel="stylesheet" href="css/finale.css">
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/cv.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/print.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/worldmap.css">
    <link rel="stylesheet" href="css/contact.css">
    <link rel="stylesheet" href="css/pdf.css">
    <link rel="stylesheet" href="css/github.css">
    <link rel="stylesheet" href="css/dark.css">
</head>

<body>
    <!-- Die Spielwelt -->
    <canvas id="world" data-i18n-aria="hud.worldAria" aria-label="Begehbare Lebenslauf-Welt"></canvas>
    <div id="vignette" aria-hidden="true"></div>
    <div id="bubbles" aria-hidden="true"></div>

    <!-- HUD -->
    <header id="hud" class="hidden">
        <div class="hud-left">
            <button id="hud-profile" class="glass" data-i18n-title="hud.journeyKey" title="Kapitelübersicht (M)">
                <span class="ring" id="hud-ring"><img id="hud-photo" alt=""></span>
                <span class="hud-id">
                    <strong id="hud-name"></strong>
                    <span id="hud-progress-label">Kapitel 0 / 6</span>
                </span>
            </button>
            <button id="objective" class="glass quest hidden" data-i18n-title="hud.autoWalk" title="Automatisch hinlaufen (G)">
                <span class="q-kicker"><i></i><span data-i18n="hud.nextGoal">Nächstes Ziel</span></span>
                <span class="q-title" id="objective-text"></span>
                <span class="q-go"><span data-i18n="hud.walkThere">Hinlaufen</span> <kbd>G</kbd></span>
            </button>
        </div>
        <div class="hud-right">
            <button id="btn-search" class="glass hbtn search" data-i18n-title="hud.searchKey" title="Suchen &amp; springen (Strg+K)"><span class="ic" data-ic="search"></span><span class="lbl" data-i18n="hud.search">Suchen</span><kbd class="lbl" data-i18n="hud.ctrlK">Strg K</kbd></button>
            <button id="btn-contact" class="hbtn accent" data-i18n-title="hud.contactTitle" title="Kontakt aufnehmen"><span class="ic" data-ic="send"></span><span class="lbl" data-i18n="hud.contactNow">Jetzt kontaktieren</span><span class="lbl-s" data-i18n="hud.contactShort">Kontakt</span></button>
            <button id="btn-cv" class="hbtn dark" data-i18n-title="hud.cvKey" title="Lebenslauf kompakt (L)"><span class="ic" data-ic="file"></span><span class="lbl" data-i18n="hud.cv">Lebenslauf</span></button>
            <button id="btn-theme" class="glass hbtn icon" data-toggle-theme title="Farbmodus" aria-label="Farbmodus"></button>
            <button id="btn-lang" class="glass hbtn icon lang-btn" data-toggle-lang data-i18n-title="hud.langSwitch" title="English" aria-label="English"><span class="lang-code" data-i18n="hud.langOther">EN</span></button>
            <button id="btn-map" class="glass hbtn icon" data-i18n-title="hud.journeyKey" title="Kapitelübersicht (M)" aria-label="Kapitelübersicht" data-ic="map"></button>
            <button id="btn-sound" class="glass hbtn icon" data-i18n-title="hud.sound" title="Soundeffekte an/aus" aria-label="Soundeffekte an/aus"></button>
            <button id="btn-music" class="glass hbtn icon off" data-i18n-title="hud.music" title="Musik an/aus" aria-label="Musik an/aus" data-ic="music"></button>
        </div>
    </header>

    <!-- Minimap -->
    <aside id="minimap" class="glass hidden" data-i18n-title="hud.minimap" title="Karte – klicken zum Hinlaufen">
        <canvas id="minimap-cnv" width="220" height="152"></canvas>
    </aside>

    <!-- Dock unten links: Sterne & Stärken -->
    <div id="dock" class="glass hidden">
        <div id="tokens" data-i18n-title="hud.tokens" title="Gesammelte Skill-Sterne"><span class="tk-ic">⭐</span><b id="tokens-val">0</b><span>/<span id="tokens-max">0</span></span></div>
        <div id="hud-badges" data-i18n-title="hud.badges" title="Entdeckte Stärken"></div>
    </div>

    <div id="controls-hint" class="hidden"></div>

    <button id="action-btn" class="hidden"></button>
    <div id="joystick" class="hidden"><div id="joystick-knob"></div></div>

    <div id="toasts" aria-live="polite"></div>

    <!-- Startbildschirm -->
    <section id="start" class="overlay start">
        <div class="start-tools" role="group" data-i18n-aria="start.langGroup" aria-label="Sprache">
            <button type="button" class="seg-btn" data-set-lang="de" lang="de">DE</button>
            <button type="button" class="seg-btn" data-set-lang="en" lang="en">EN</button>
            <span class="seg-sep" aria-hidden="true"></span>
            <button type="button" class="seg-btn icon" data-set-theme="light" data-i18n-title="theme.light" title="Hell"></button>
            <button type="button" class="seg-btn icon" data-set-theme="dark" data-i18n-title="theme.dark" title="Dunkel"></button>
        </div>
        <div class="start-wrap">
            <div class="start-copy">
                <p id="start-greeting" class="eyebrow"></p>
                <h1 id="start-title"></h1>
                <p id="start-role" class="role"></p>
                <p id="start-tagline" class="tagline"></p>
                <div class="start-buttons">
                    <button id="start-play" class="cta-btn primary">
                        <span class="cta-ic">▶</span>
                        <span class="cta-txt"><b data-i18n="start.play">Spiel starten</b><small data-i18n="start.playSub">ca. 3 Min. · jedes Spiel überspringbar</small></span>
                        <kbd>Enter</kbd>
                    </button>
                    <button id="start-cv" class="cta-btn ghost">
                        <span class="cta-ic">⚡</span>
                        <span class="cta-txt"><b data-i18n="start.cv">Lebenslauf in 30 Sek.</b><small data-i18n="start.cvSub">klassisch · als PDF speicherbar</small></span>
                        <kbd>L</kbd>
                    </button>
                </div>
                <p class="start-foot" id="start-foot"></p>
                <p class="start-legal"><a href="datenschutz.html" data-i18n="start.privacy">Datenschutz</a></p>
            </div>
            <div class="pcard" id="pcard" aria-hidden="true">
                <div class="pcard-in">
                    <div class="pc-top"><span class="pc-badge" data-i18n="start.player1">Spieler 1</span><span class="pc-status"><i></i><span id="pc-status"></span></span></div>
                    <div class="pc-photo"><img id="start-photo" alt=""><span class="wave">👋</span></div>
                    <div class="pc-name"><strong id="pc-name"></strong><span id="pc-class"></span></div>
                    <div class="pc-stats" id="start-stats"></div>
                    <div class="pc-chapters" id="start-chapters"></div>
                    <span class="pc-shine"></span>
                </div>
            </div>
        </div>
    </section>

    <!-- Stations-Dialog (Story, Minispiel, Infos) -->
    <section id="station" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="station-title">
        <div class="panel station-panel">
            <header class="sp-hero">
                <button class="close" id="station-close" data-i18n-title="common.close" aria-label="Schließen">✕</button>
                <div class="sp-meta"><span id="station-chapter"></span><span id="station-era"></span></div>
                <div class="sp-title"><span id="station-emoji" class="sp-emoji"></span><h2 id="station-title"></h2></div>
                <div class="sp-steps" id="station-steps"></div>
            </header>
            <div id="station-body"></div>
        </div>
    </section>

    <!-- Kapitelübersicht -->
    <section id="journey" class="overlay hidden" role="dialog" aria-modal="true" data-i18n-aria="journey.title" aria-label="Kapitelübersicht">
        <div class="panel narrow">
            <button class="close" data-close="journey" data-i18n-title="common.close" aria-label="Schließen">✕</button>
            <header class="plain-head">
                <span class="kicker" data-i18n="journey.kicker">Mein Weg in 7 Stationen</span>
                <h2 data-i18n="journey.title">Kapitelübersicht</h2>
                <p class="muted" id="journey-sub"></p>
            </header>
            <ol id="journey-list"></ol>
        </div>
    </section>

    <!-- Easter Egg: alle Skill-Sterne gefunden -->
    <section id="backstage" class="overlay hidden" role="dialog" aria-modal="true" data-i18n-aria="backstage.title" aria-label="Hinter den Kulissen">
        <div class="panel narrow">
            <button class="close" data-close="backstage" data-i18n-title="common.close" aria-label="Schließen">✕</button>
            <header class="plain-head">
                <span class="kicker" data-i18n="backstage.kicker">Easter Egg</span>
                <h2 data-i18n="backstage.title">Hinter den Kulissen</h2>
            </header>
            <div id="backstage-body"></div>
        </div>
    </section>

    <!-- Befehlspalette -->
    <section id="palette" class="overlay hidden" role="dialog" aria-modal="true" data-i18n-aria="palette.aria" aria-label="Suchen und springen">
        <div class="palette">
            <label class="pal-input">
                <span aria-hidden="true">🔎</span>
                <input id="pal-q" type="text" autocomplete="off" spellcheck="false" data-i18n-placeholder="palette.placeholder" placeholder="Wonach suchen Sie? z. B. Java, PSI, Englisch …">
                <kbd>Esc</kbd>
            </label>
            <ul id="pal-list" role="listbox"></ul>
            <div class="pal-foot"><span><kbd>↑</kbd><kbd>↓</kbd> <span data-i18n="palette.select">auswählen</span></span><span><kbd>↵</kbd> <span data-i18n="palette.open">öffnen</span></span><span><kbd>M</kbd> <span data-i18n="palette.map">Karte</span> · <kbd>L</kbd> <span data-i18n="palette.cvShort">Lebenslauf</span></span></div>
        </div>
    </section>

    <!-- Kontaktformular -->
    <section id="contact" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="contact-title">
        <div class="panel narrow contact-panel">
            <button class="close" data-close="contact" data-i18n-title="common.close" aria-label="Schließen">✕</button>
            <header class="plain-head">
                <span class="kicker" data-i18n="contact.kicker">Kontakt</span>
                <h2 id="contact-title" data-i18n="contact.title">Lassen Sie uns sprechen</h2>
                <p class="muted" data-i18n="contact.intro">Schreiben Sie mir kurz – die Nachricht landet direkt in meinem Postfach.</p>
            </header>
            <div id="contact-body"></div>
        </div>
    </section>

    <!-- Kompakter Lebenslauf (auch Druck/PDF) -->
    <section id="cv" class="overlay hidden" role="dialog" aria-modal="true" data-i18n-aria="cv.aria" aria-label="Lebenslauf kompakt">
        <div class="cv-sheet" id="cv-sheet"></div>
    </section>

    <noscript>
        <div style="padding:24px;font-family:sans-serif">
            <h1>Abdul Kader Sabouni</h1>
            <p>Softwareentwickler (Werkstudent) bei PSI Software SE · Informatikstudium an der FH Dortmund.</p>
            <p>Für die interaktive Version bitte JavaScript aktivieren.</p>
        </div>
    </noscript>

    <a href="admin.html" id="admin-link" title="Admin" aria-label="Admin">⚙︎</a>

    <!-- Inhalte (klassische Skripte, damit admin.html sie genauso lesen kann), danach die App als ES-Modul -->
    <script src="data/resume.de.js"></script>
    <script src="data/resume.en.js"></script>
    <script type="module" src="js/main.js"></script>
</body>

</html>

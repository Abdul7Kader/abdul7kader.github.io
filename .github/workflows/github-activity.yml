# Aktualisiert github-activity.json (Commit-Kacheln auf der Webseite) täglich und nach jedem Push auf main.
# Optional: Repository-Secret ACTIVITY_TOKEN (Personal Access Token, nur Leserechte) anlegen –
# dann zählen auch private Beiträge mit, sofern sie im GitHub-Profil freigegeben sind.
name: GitHub-Aktivität aktualisieren

on:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main]
    paths-ignore: ['github-activity.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-activity
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Daten holen
        env:
          GH_TOKEN: ${{ secrets.ACTIVITY_TOKEN || secrets.GITHUB_TOKEN }}
        run: node tools/github-activity.mjs "${{ github.repository_owner }}" github-activity.json
      - name: Änderungen speichern
        run: |
          if git diff --quiet -- github-activity.json && git ls-files --error-unmatch github-activity.json >/dev/null 2>&1; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-activity.json
          git commit -m "GitHub-Aktivität aktualisiert"
          git push
